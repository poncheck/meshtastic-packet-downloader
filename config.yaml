# Meshtastic Packet Downloader Configuration

# API sources - list of URLs to fetch packets from
api_sources:
  - name: "Zachód"
    url: "https://lorastats.pl/API/Zach%C3%B3d/PacketsRaw/JSON"
    enabled: true
  # Add more sources here as needed:
  # - name: "Source2"
  #   url: "https://example.com/api/packets"
  #   enabled: true

# API request settings
api_settings:
  user_agent: "Meshtastic Packet Downloader - info@meshtastic.info.pl - https://meshtastic.info.pl"
  timeout: 30  # seconds
  retry_attempts: 3
  retry_delay: 5  # seconds

# MQTT broker settings
mqtt:
  broker: "mqtt.example.com"
  port: 1883
  username: "your_username"
  password: "your_password"
  topic_prefix: "meshtastic/packets"  # packets will be published to: meshtastic/packets/{node_id}
  qos: 1  # MQTT QoS level (0, 1, or 2)
  retain: false
  client_id: "meshtastic_downloader"

# Meshtastic decryption settings
meshtastic:
  # Default encryption key (AQ== is the default Meshtastic key: "AQ==")
  default_key: "AQ=="
  # You can add more keys to try if the default fails:
  additional_keys: []

# Processing settings
processing:
  poll_interval: 60  # seconds between API polls
  state_file: "processed_packets.json"  # file to track processed packets
  max_state_size: 10000  # maximum number of packet IDs to keep in state

# Logging settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "meshtastic_downloader.log"
  max_file_size: 10485760  # 10 MB
  backup_count: 5
